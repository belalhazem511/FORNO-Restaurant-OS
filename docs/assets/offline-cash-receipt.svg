<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Offline cash receipt model</title>
  <desc id="desc">Illustration of an offline cash receipt showing pending synchronization status.</desc>
  <rect width="900" height="760" fill="#111827"/>
  <rect x="295" y="54" width="310" height="650" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="450" y="105" text-anchor="middle" fill="#111827" font-size="32" font-weight="700">FORNO</text>
    <text x="450" y="134" text-anchor="middle" fill="#475569" font-size="15">Branch: Cairo Demo</text>
    <line x1="325" y1="158" x2="575" y2="158" stroke="#cbd5e1"/>
    <text x="450" y="190" text-anchor="middle" fill="#991b1b" font-size="18" font-weight="700">CASH RECEIVED - OFFLINE</text>
    <text x="450" y="217" text-anchor="middle" fill="#991b1b" font-size="16" font-weight="700">PENDING SERVER SYNCHRONIZATION</text>
    <line x1="325" y1="242" x2="575" y2="242" stroke="#cbd5e1"/>
    <text x="325" y="276" fill="#111827" font-size="15">Offline No.</text>
    <text x="575" y="276" text-anchor="end" fill="#111827" font-size="15" font-weight="700">OFF-CAI-R01-8F3A</text>
    <text x="325" y="306" fill="#111827" font-size="15">Cashier</text>
    <text x="575" y="306" text-anchor="end" fill="#111827" font-size="15">Admin</text>
    <text x="325" y="336" fill="#111827" font-size="15">Register</text>
    <text x="575" y="336" text-anchor="end" fill="#111827" font-size="15">Front POS</text>
    <text x="325" y="366" fill="#111827" font-size="15">Order type</text>
    <text x="575" y="366" text-anchor="end" fill="#111827" font-size="15">Dine-in</text>
    <line x1="325" y1="390" x2="575" y2="390" stroke="#cbd5e1"/>
    <text x="325" y="424" fill="#111827" font-size="15">Pizza Margherita x1</text>
    <text x="575" y="424" text-anchor="end" fill="#111827" font-size="15">EGP 120.00</text>
    <text x="340" y="452" fill="#64748b" font-size="13">+ extra mozzarella</text>
    <text x="325" y="482" fill="#111827" font-size="15">Doner Sandwich x1</text>
    <text x="575" y="482" text-anchor="end" fill="#111827" font-size="15">EGP 95.00</text>
    <text x="325" y="512" fill="#111827" font-size="15">Latte x1</text>
    <text x="575" y="512" text-anchor="end" fill="#111827" font-size="15">EGP 60.00</text>
    <line x1="325" y1="536" x2="575" y2="536" stroke="#cbd5e1"/>
    <text x="325" y="570" fill="#111827" font-size="16">Subtotal</text>
    <text x="575" y="570" text-anchor="end" fill="#111827" font-size="16">EGP 275.00</text>
    <text x="325" y="602" fill="#111827" font-size="16" font-weight="700">Cash collected</text>
    <text x="575" y="602" text-anchor="end" fill="#111827" font-size="16" font-weight="700">EGP 275.00</text>
    <text x="325" y="634" fill="#111827" font-size="16">Cash received</text>
    <text x="575" y="634" text-anchor="end" fill="#111827" font-size="16">EGP 300.00</text>
    <text x="325" y="666" fill="#111827" font-size="16">Change given</text>
    <text x="575" y="666" text-anchor="end" fill="#111827" font-size="16">EGP 25.00</text>
  </g>
</svg>
