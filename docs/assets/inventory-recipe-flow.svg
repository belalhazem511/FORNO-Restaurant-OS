<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Recipe-driven inventory flow</title>
  <desc id="desc">Diagram showing ingredients, recipes, order production, stock ledger, balances, and cost snapshots.</desc>
  <rect width="1200" height="600" fill="#fff7ed"/>
  <text x="600" y="58" text-anchor="middle" fill="#431407" font-family="Arial, sans-serif" font-size="32" font-weight="700">Recipe-Driven Inventory</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="130" width="220" height="120" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="180" y="168" text-anchor="middle" fill="#9a3412" font-size="21" font-weight="700">Ingredients</text>
    <text x="180" y="202" text-anchor="middle" fill="#431407" font-size="16">Exact base units</text>
    <text x="180" y="228" text-anchor="middle" fill="#431407" font-size="16">Weighted cost</text>
    <rect x="360" y="130" width="220" height="120" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="470" y="168" text-anchor="middle" fill="#854d0e" font-size="21" font-weight="700">Recipes</text>
    <text x="470" y="202" text-anchor="middle" fill="#431407" font-size="16">Versions and approval</text>
    <text x="470" y="228" text-anchor="middle" fill="#431407" font-size="16">Variants, modifiers</text>
    <rect x="650" y="130" width="220" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="760" y="168" text-anchor="middle" fill="#166534" font-size="21" font-weight="700">Kitchen Commit</text>
    <text x="760" y="202" text-anchor="middle" fill="#431407" font-size="16">Order sent to kitchen</text>
    <text x="760" y="228" text-anchor="middle" fill="#431407" font-size="16">Consume once</text>
    <rect x="940" y="130" width="220" height="120" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="1050" y="168" text-anchor="middle" fill="#991b1b" font-size="21" font-weight="700">Stock Guard</text>
    <text x="1050" y="202" text-anchor="middle" fill="#431407" font-size="16">Block insufficient</text>
    <text x="1050" y="228" text-anchor="middle" fill="#431407" font-size="16">Manager override</text>
    <rect x="210" y="360" width="250" height="130" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="335" y="400" text-anchor="middle" fill="#075985" font-size="21" font-weight="700">Movement Ledger</text>
    <text x="335" y="434" text-anchor="middle" fill="#431407" font-size="16">Append-only postings</text>
    <text x="335" y="460" text-anchor="middle" fill="#431407" font-size="16">Reversals and waste</text>
    <rect x="520" y="360" width="250" height="130" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="645" y="400" text-anchor="middle" fill="#5b21b6" font-size="21" font-weight="700">Balances</text>
    <text x="645" y="434" text-anchor="middle" fill="#431407" font-size="16">Current on hand</text>
    <text x="645" y="460" text-anchor="middle" fill="#431407" font-size="16">Low and out of stock</text>
    <rect x="830" y="360" width="250" height="130" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="955" y="400" text-anchor="middle" fill="#334155" font-size="21" font-weight="700">COGS Snapshot</text>
    <text x="955" y="434" text-anchor="middle" fill="#431407" font-size="16">Order item cost</text>
    <text x="955" y="460" text-anchor="middle" fill="#431407" font-size="16">Historical immutable</text>
    <path d="M290 190 H360" stroke="#7c2d12" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M580 190 H650" stroke="#7c2d12" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M870 190 H940" stroke="#7c2d12" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M760 250 V302 H335 V360" stroke="#7c2d12" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M460 425 H520" stroke="#7c2d12" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M770 425 H830" stroke="#7c2d12" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c2d12"/>
    </marker>
  </defs>
</svg>
